name: Test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  GIT_TERMINAL_PROMPT: '0'
  GIT_CONFIG_NOSYSTEM: '1'

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Create empty git config
        shell: bash
        run: |
          posix_runner_temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          : > "$posix_runner_temp/empty-gitconfig"
          config_path="$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')/empty-gitconfig"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config_path" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_SYSTEM=%s\n' "$config_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/release/test/*.test.mjs

  plugin-matrix:
    needs: release-engine
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Create empty git config
        shell: bash
        run: |
          posix_runner_temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          : > "$posix_runner_temp/empty-gitconfig"
          config_path="$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')/empty-gitconfig"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config_path" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_SYSTEM=%s\n' "$config_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: matrix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module - >> "$GITHUB_OUTPUT" <<'NODE'
          import { selectAffectedPlugins } from './scripts/release/lib/affected-suites.mjs';
          import { readFragments } from './scripts/release/lib/fragments.mjs';
          import { createGit } from './scripts/release/lib/git.mjs';
          import { checkManifest, readManifest } from './scripts/release/lib/manifests.mjs';
          import { createSuiteResolver } from './scripts/release/lib/suites.mjs';
          import { diskSource } from './scripts/release/lib/treesource.mjs';
          const root = process.cwd();
          const source = diskSource(root);
          const manifest = readManifest(source, root);
          const errors = checkManifest(manifest);
          if (errors.length) throw new Error(errors.join('\n'));
          const fragments = readFragments(source, { knownPlugins: new Set(manifest.plugins.keys()) });
          if (fragments.errors.length) throw new Error(fragments.errors.join('\n'));
          const affected = new Set(selectAffectedPlugins({
            git: createGit({ cwd: root }),
            base: process.env.BASE_SHA,
            head: process.env.GITHUB_SHA,
            manifest,
          }));
          const resolveSuite = createSuiteResolver(root);
          const suites = [...manifest.plugins.values()].map((plugin) => ({ plugin, suite: resolveSuite(plugin) }));
          const missing = suites.filter(({ suite }) => suite === null).map(({ plugin }) => plugin.name);
          if (missing.length) throw new Error(`Published plugins without a test suite: ${missing.join(', ')}`);
          const include = suites.flatMap(({ plugin, suite }) => ['ubuntu-latest', 'windows-latest'].flatMap((os) => {
            const count = suite.shards?.[os.split('-')[0]] ?? 1;
            return Array.from({ length: count }, (_, position) => ({
              name: count > 1 ? `${plugin.name} shard ${position + 1}/${count}` : plugin.name,
              shard: count > 1 ? `${position + 1}/${count}` : '',
              path: plugin.dir,
              setup: suite.setup ?? '',
              command: suite.command,
              moduleTest: suite.moduleTest ?? '',
              affected: affected.has(plugin.name),
              os,
            }));
          }));
          process.stdout.write(`matrix=${JSON.stringify({ include })}\n`);
          NODE

  affected-plugin:
    needs: plugin-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plugin-matrix.outputs.matrix) }}
    steps:
      - name: Create empty git config
        shell: bash
        run: |
          posix_runner_temp="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")"
          : > "$posix_runner_temp/empty-gitconfig"
          config_path="$(printf '%s' "$RUNNER_TEMP" | tr '\\' '/')/empty-gitconfig"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config_path" >> "$GITHUB_ENV"
          printf 'GIT_CONFIG_SYSTEM=%s\n' "$config_path" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code for module tests
        if: matrix.affected && matrix.moduleTest != '' && (matrix.shard == '' || startsWith(matrix.shard, '1/'))
        run: npm install -g @anthropic-ai/claude-code
      - name: Test affected plugin
        shell: bash
        env:
          AFFECTED: ${{ matrix.affected }}
          SETUP: ${{ matrix.setup }}
          COMMAND: ${{ matrix.command }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$AFFECTED" = "false" ]; then
            echo "${{ matrix.name }} is unaffected"
            exit 0
          fi
          cd "${{ matrix.path }}"
          if [ -n "$SETUP" ]; then eval "$SETUP"; fi
          if [ -n "$SHARD" ]; then export SIDEQUEST_TEST_SHARD="$SHARD"; fi
          if [ -n "$COMMAND" ]; then eval "$COMMAND"; fi

      - name: Test affected plugin modules
        if: matrix.affected && matrix.moduleTest != '' && (matrix.shard == '' || startsWith(matrix.shard, '1/'))
        shell: bash
        working-directory: ${{ matrix.path }}
        env:
          MODULE_TEST: ${{ matrix.moduleTest }}
        run: eval "$MODULE_TEST"

  # Branch protection requires check names, and the matrix job names are generated per
  # plugin/platform pair: they truncate and collide, so none of them is a stable thing to require.
  # This job is the one name that means "every test job passed on this sha".
  test-complete:
    if: always()
    needs: [release-engine, plugin-matrix, affected-plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = Object.entries(JSON.parse(process.env.RESULTS));
            const failed = jobs.filter(([, job]) => job.result !== "success");
            for (const [name, job] of jobs) console.log(`${name}: ${job.result}`);
            if (failed.length > 0) {
              console.error(`failed: ${failed.map(([name]) => name).join(", ")}`);
              process.exit(1);
            }
          '
