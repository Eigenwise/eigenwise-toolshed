name: docs

# A pull request builds the site and stops there. A push to main builds it and deploys it to Pages.
# The reference pages are generated from the plugins, so a plugin's version bump redeploys the site.
on:
  pull_request:
    paths:
      - docs/**
      - plugins/*/.claude-plugin/plugin.json
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - plugins/*/.claude-plugin/plugin.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install the documentation dependencies
        working-directory: docs
        run: npm ci
      - name: Build the site
        working-directory: docs
        run: npm run build
      - name: Check every internal link
        working-directory: docs
        run: npm run links
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
