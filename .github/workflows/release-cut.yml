name: Daily GitHub Release

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-github-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./.claude-plugin/marketplace.json').version")"
          if gh release view "v$version" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi
          result="$(node scripts/release/daily-release.mjs \
            --marketplace .claude-plugin/marketplace.json \
            --release-exists "$release_exists")"
          node - "$result" >> "$GITHUB_OUTPUT" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          process.stdout.write(`decision=${result.decision}\ntag=${result.tag}\n`);
          NODE
      - name: Create the marketplace tag and GitHub Release
        if: steps.decision.outputs.decision == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decision.outputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
            tag_sha="$(node -p "require(process.env.RUNNER_TEMP + '/tag.json').object.sha")"
            if [ "$tag_sha" != "$sha" ]; then
              echo "$TAG already exists at $tag_sha, not main at $sha."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$sha"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          if ! gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes; then
            gh release view "$TAG" >/dev/null
          fi
